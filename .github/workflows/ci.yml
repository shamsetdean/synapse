name: Vérification de build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Annule une exécution en cours si un nouveau commit arrive sur la même
# branche : inutile de vérifier un état déjà dépassé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation Next.js
    runs-on: ubuntu-latest

    env:
      # next build peut évaluer ces variables lors de l'analyse des pages.
      # Valeurs factices : aucune requête réseau n'est émise à la compilation,
      # et la clé anon est de toute façon publique par conception.
      # Si la compilation échoue faute de valeurs réelles, il faudra les
      # déclarer en secrets de dépôt et les référencer ici.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Pas de mise en cache : elle exige un fichier de verrouillage,
          # que le dépôt ne contient pas encore. À activer avec cache: npm
          # une fois package-lock.json versionné.

      - name: Installer les dépendances
        # npm ci exigerait un package-lock.json. En son absence, npm install
        # résout les versions à la volée — c'est précisément ce que fait
        # Vercel aujourd'hui, donc cette étape reproduit fidèlement la
        # production, y compris son défaut de reproductibilité.
        run: npm install

      - name: Compiler
        # next build échoue sur toute erreur TypeScript, next.config.mjs ne
        # définissant aucun contournement. Cette étape couvre donc à la fois
        # la compilation, le typage et les imports manquants.
        run: npm run build

      - name: Analyser le code
        # Non bloquant pour l'instant : le fichier de configuration ESLint
        # apparaît sous le nom "eslintrc.json", sans point initial, ce qui
        # empêcherait ESLint de le lire. À rendre bloquant en supprimant
        # cette ligne une fois le nom du fichier confirmé.
        continue-on-error: true
        run: npm run lint
