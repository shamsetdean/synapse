name: Vérification de build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Annule une exécution en cours si un nouveau commit arrive sur la même
# branche : inutile de vérifier un état déjà dépassé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation Next.js
    runs-on: ubuntu-latest

    env:
      # next build peut évaluer ces variables lors de l'analyse des pages.
      # Valeurs factices : aucune requête réseau n'est émise à la compilation,
      # et la clé anon est de toute façon publique par conception.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          # La mise en cache automatique de setup-node v6 s'appuie sur un
          # fichier de verrouillage, absent du dépôt : elle ne ferait rien
          # et brouillerait le journal. À réactiver une fois
          # package-lock.json versionné.
          package-manager-cache: false

      - name: Installer les dépendances
        # npm ci exigerait un package-lock.json. En son absence, npm install
        # résout les versions à la volée — c'est exactement ce que fait
        # Vercel aujourd'hui, donc cette étape reproduit fidèlement la
        # production, y compris son défaut de reproductibilité.
        run: npm install

      - name: Compiler
        # next build échoue sur toute erreur TypeScript, next.config.mjs ne
        # définissant aucun contournement. Cette étape couvre donc à la fois
        # la compilation, le typage et les imports manquants.
        run: npm run build

      - name: Analyser le code
        # Bloquant depuis le renommage de .eslintrc.json : la configuration
        # next/core-web-vitals est désormais lue et ne remonte aucune erreur
        # sur le code existant. Toute nouvelle erreur fera échouer le job.
        run: npm run lint
